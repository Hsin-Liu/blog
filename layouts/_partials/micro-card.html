<article class="micro-card">
  <div class="micro-card-meta">
    <time class="micro-card-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
      {{- .Date.Format "Jan 2, 2006" -}}
    </time>
    <a class="micro-card-permalink" href="{{ .RelPermalink }}" aria-label="Permalink to {{ .Title }}">→</a>
  </div>
  <div class="micro-card-body md-content">
    {{ .Content }}
  </div>
  {{- with .Params.tags }}
  <div class="micro-card-tags">
    {{- range . }}
    <a class="tag" href="{{ printf "tags/%s/" . | urlize | relURL }}">#{{ . }}</a>
    {{- end }}
  </div>
  {{- end }}
</article>

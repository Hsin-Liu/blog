baseURL = 'https://blog.xinliu.uk/'
locale = 'en-us'
title = 'Blog of Xin'
theme = 'PaperMod'

[taxonomies]
tag = 'tags'
category = 'categories'

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [['$$', '$$']]
delimiters.inline = [['$', '$']]

[params]
description = 'A personal blog'
author = 'Xin Liu'
keywords = ['blog', 'Mathematics', 'Finance']

# Profile / Bio
[params.profile]
enabled = true
avatar = ''  # leave empty for initial, set URL later
name = 'Xin Liu'
tagline = 'Mathematics & Finance'
bio = 'I came; I saw; I conquered.'

# Social links

[[params.social]]
name = 'Email'
icon = 'mail'
url = 'mailto:xinliu2861@gmail.com'

# Site info
[params.siteInfo]
hideFooter = true

# Home page config
[params.homeInfoParams]
enabled = true

# Top navigation. Adding any [[menu.main]] entry disables Hugo's
# section auto-population, so both sections must be declared explicitly.
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "micros"
name = "Micros"
url = "/micros/"
weight = 20
